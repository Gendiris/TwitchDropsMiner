<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Drops Miner</title>
  <link rel="stylesheet" href="/webui/styles.css?v=20260813">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">
    <header class="topbar">
      <div class="topbar-left">
        <button id="menuToggle" class="menu-toggle" aria-label="Navigation">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="brand">
          <i class="fa-solid fa-cube"></i>
          <span>Drops Miner</span>
        </div>
      </div>

      <div class="topbar-actions">
        <span id="connectionStatus" class="connection-status offline">&#9679; Offline</span>
        <div id="uptimeDisplay" class="uptime-chip">
            <i class="fa-regular fa-clock"></i> 00:00
        </div>
        <button id="reloadButton" class="icon-btn" title="Reload">
            <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
    </header>

    <div class="main-wrapper">
        <nav class="nav-panel" id="navPanel">
          <div class="nav-links">
            <button class="nav-btn active" data-tab="dashboard">
              <i class="fa-solid fa-chart-line"></i> <span>Dashboard</span>
            </button>
            <button class="nav-btn" data-tab="settings">
              <i class="fa-solid fa-gear"></i> <span>Settings</span>
            </button>
          </div>
        </nav>
        <div class="nav-overlay" id="navOverlay"></div>

        <main class="content">

          <div id="tab-dashboard" class="tab-content active">

            <div class="dashboard-grid">

                <section class="hero-card card">
                    <div class="hero-main">
                        <div class="hero-main-row">
                            <div class="status-indicator">
                                <span class="pulse-dot" id="statusDot"></span>
                                <h2 id="stateText">Status</h2>
                            </div>
                            <div class="current-watch">
                                <i class="fa-solid fa-tv watch-icon"></i>
                                <span id="watchingText">Warten...</span>
                            </div>
                        </div>
                        <div id="lastEventText" style="display:none"></div>
                    </div>
                    <div class="hero-meta">
                        <span class="meta-chip" id="loadDisplay">Load: --</span>
                        <span class="meta-chip" id="lastReloadDisplay">Reload: --</span>
                        <span class="meta-chip pending" id="pendingSwitchText" style="display:none">Switching</span>
                    </div>
                </section>

                <section class="card drops-area">
                    <div class="card-header-complex">
                        <h3>Drops <span id="dropsCounter" class="counter-badge">0</span></h3>

                        <div class="filter-toolbar">
                            <div class="search-box">
                                <input type="text" id="searchInput" placeholder="Suche...">
                            </div>
                            <label class="prio-toggle">
                                <input type="checkbox" id="filterPriorityBtn">
                                <i class="fa-solid fa-star"></i>
                            </label>
                            <select id="sortSelect" class="sort-select">
                                <option value="priority">Priorität</option>
                                <option value="name">Name</option>
                                <option value="progress">Fortschritt</option>
                                <option value="last_seen">Zuletzt gesehen</option>
                            </select>
                        </div>
                    </div>
                    <div class="filter-chips-row">
                        <button class="filter-chip active" data-filter="all">Alle</button>
                        <button class="filter-chip" data-filter="progressing">Laufend</button>
                        <button class="filter-chip" data-filter="claimed">Claimed</button>
                    </div>

                    <div class="table-wrapper">
                        <table id="campaignsTable">
                            <thead>
                                <tr>
                                    <th style="width: 40%">Game</th>
                                    <th>Fortschritt</th>
                                    <th style="width: 50px; text-align:right;">Claim</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </section>

                <div class="info-column">
                    <div class="info-tabs">
                        <button class="info-tab-btn active" data-panel="logs">Log</button>
                        <button class="info-tab-btn" data-panel="watchdog">Watchdog</button>
                        <button class="info-tab-btn" data-panel="channels">Kanäle</button>
                    </div>

                    <section class="card logs-card info-panel active" data-panel="logs">
                        <div class="card-header-complex">
                            <h3>Log</h3>
                        </div>
                        <div class="timeline-container">
                            <ul id="timelineList" class="timeline"></ul>
                        </div>
                    </section>

                    <section class="card watchdog-card info-panel" data-panel="watchdog">
                        <div class="card-header-complex">
                            <h3>Watchdog</h3>
                        </div>
                        <div class="timeline-container">
                            <ul id="watchdogList" class="timeline"></ul>
                        </div>
                    </section>

                    <section class="card channels-card info-panel" data-panel="channels">
                         <div class="card-header-complex">
                            <h3>Kanäle</h3>
                        </div>
                        <div class="table-wrapper">
                            <table id="channelsTable">
                                <thead>
                                    <tr>
                                        <th>Login</th>
                                        <th>Status</th>
                                        <th style="text-align:center;">Drops</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </section>
                </div>

            </div>
          </div>

          <div id="tab-settings" class="tab-content">
            <section class="card settings-card">
              <div class="card-header-complex">
                <h3>Einstellungen</h3>
                <span id="settingsStatus"></span>
              </div>
              <form id="settingsForm">
                 <div class="form-grid">
                    <div class="form-group">
                        <label>Sprache</label>
                        <select name="language">
                            <option value="English">English</option>
                            <option value="Deutsch">Deutsch</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Prioritätsmodus</label>
                        <select name="priority_mode">
                            <option value="PRIORITY_ONLY">Priorität zuerst</option>
                            <option value="ENDING_SOONEST">Endet bald</option>
                            <option value="LOW_AVBL_FIRST">Seltenheit</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Qualität (Header)</label>
                        <select name="connection_quality">
                            <option value="1">160p</option>
                            <option value="6">1080p</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Priorität (CSV)</label>
                        <input type="text" name="priority">
                    </div>
                    <div class="form-group">
                        <label>Ausschluss (CSV)</label>
                        <input type="text" name="exclude">
                    </div>
                     <div class="form-group">
                        <label>Proxy</label>
                        <input type="text" name="proxy">
                    </div>
                 </div>

                 <div class="toggles-grid">
                    <label class="toggle-card"><input type="checkbox" name="tray_notifications"> <span>Tray Info</span></label>
                    <label class="toggle-card"><input type="checkbox" name="autostart_tray"> <span>Autostart</span></label>
                    <label class="toggle-card"><input type="checkbox" name="enable_badges_emotes"> <span>Farm Badges</span></label>
                    <label class="toggle-card"><input type="checkbox" name="available_drops_check"> <span>Check Drops</span></label>
                 </div>

                 <div class="form-actions">
                    <button type="submit" class="btn-primary">Speichern</button>
                 </div>
              </form>
            </section>
          </div>

        </main>
    </div>
  </div>
  <script src="/webui/main.js"></script>
</body>
</html>
